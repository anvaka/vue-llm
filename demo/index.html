<!doctype html>
<!-- The playground UI is built for a dark surface (panels use translucent
     white overlays); pin the theme dark so it renders the same regardless of
     the OS light/dark preference. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vue-llm · reasoning effort playground</title>
    <!-- Inline SVG favicon (ascending bars, echoing the effort dial) so the
         browser doesn't 404 on /favicon.ico — no emoji. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%236366f1'/%3E%3Crect%20x='6'%20y='19'%20width='5'%20height='7'%20rx='1.5'%20fill='%23ffffff'/%3E%3Crect%20x='13.5'%20y='13'%20width='5'%20height='13'%20rx='1.5'%20fill='%23ffffff'/%3E%3Crect%20x='21'%20y='7'%20width='5'%20height='19'%20rx='1.5'%20fill='%23ffffff'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--llm-bg, #181a1f);
        color: var(--llm-text, #e6e8ea);
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
